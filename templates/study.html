<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>공부 기록</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        header {
            background-color: #4f46e5;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        input,
        textarea {
            padding: 10px;
            margin: 3px;

            border: 1px solid #ddd;
            border-radius: 8px;
        }

        textarea {
            width: 90%;
            height: 60px;
            resize: vertical;
        }

        button {
            padding: 10px 15px;

            border: none;
            border-radius: 8px;

            background-color: #4f46e5;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background-color: #3730a3;
        }

        .delete {
            background-color: #dc2626;
        }

        .delete:hover {
            background-color: #b91c1c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;

            border-bottom: 1px solid #ddd;

            text-align: center;
        }

        th {
            background-color: #f8f8f8;
        }

        .hours {
            font-weight: bold;
            color: #4f46e5;
        }

        a {
            color: #4f46e5;
            text-decoration: none;
        }

    </style>

</head>


<body>


<header>

    <h1>📚 공부 기록</h1>

    <p>
        내가 공부한 내용을 기록해보세요.
    </p>

</header>


<div class="container">


    <!-- 공부 기록 추가 -->

    <div class="card">

        <h2>➕ 공부 기록 추가</h2>


        <form action="/add_study" method="POST">


            <input
                type="date"
                name="date"
                required
            >


            <input
                type="text"
                name="subject"
                placeholder="과목"
                required
            >


            <input
                type="number"
                name="hours"
                placeholder="공부 시간"
                min="0.1"
                step="0.1"
                required
            >

            시간


            <br>


            <textarea
                name="content"
                placeholder="무엇을 공부했나요?"
            ></textarea>


            <br>


            <button type="submit">
                공부 기록 저장
            </button>

        </form>

    </div>



    <!-- 공부 기록 목록 -->

    <div class="card">

        <h2>📝 공부 기록</h2>


        <table>

            <tr>

                <th>날짜</th>

                <th>과목</th>

                <th>공부 시간</th>

                <th>공부 내용</th>

                <th>관리</th>

            </tr>


            {% for log in logs %}

            <tr>

                <td>
                    {{ log["date"] }}
                </td>


                <td>
                    <input
                        type="text"
                        name="subject"
                        value="{{ log['subject'] }}"
                        form="edit{{ log['id'] }}"
                    >
                </td>


                <td>

                    <input
                        type="number"
                        name="hours"
                        value="{{ log['hours'] }}"
                        min="0.1"
                        step="0.1"
                        form="edit{{ log['id'] }}"
                        style="width:70px;"
                    >

                    시간

                </td>


                <td>

                    <input
                        type="text"
                        name="content"
                        value="{{ log['content'] }}"
                        form="edit{{ log['id'] }}"
                    >

                </td>


                <td>


                    <!-- 수정용 폼 -->

                    <form
                        id="edit{{ log['id'] }}"
                        action="/edit_study/{{ log['id'] }}"
                        method="POST"
                    >

                        <input
                            type="hidden"
                            name="date"
                            value="{{ log['date'] }}"
                        >

                        <button type="submit">
                            수정
                        </button>

                    </form>


                    <!-- 삭제용 폼 -->

                    <form
                        action="/delete_study/{{ log['id'] }}"
                        method="POST"
                        style="margin-top:5px;"
                        onsubmit="return confirm('정말 삭제할까요?');"
                    >

                        <button
                            type="submit"
                            class="delete"
                        >
                            삭제
                        </button>

                    </form>


                </td>

            </tr>

            {% endfor %}


        </table>

    </div>


    <a href="/">
        ← 메인 화면으로 돌아가기
    </a>


</div>


</body>

</html>
