<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyMate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
        }

        header {
            background: white;
            padding: 20px 40px;
            border-bottom: 1px solid #eee;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            margin-bottom: 8px;
        }

        .welcome p {
            color: #777;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .stat-title {
            color: #777;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .menu-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);

            cursor: pointer;
            transition: 0.2s;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .menu-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .menu-card h2 {
            margin: 0 0 10px;
        }

        .menu-card p {
            color: #777;
            margin: 0;
        }

        @media (max-width: 700px) {

            header {
                padding: 18px 20px;
            }

            .container {
                margin: 25px auto;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .menu {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        📚 StudyMate
    </div>

</header>


<div class="container">


    <!-- 인사말 -->

    <div class="welcome">

        <h1>안녕하세요! 👋</h1>

        <p>
            오늘도 공부를 시작해볼까요?
        </p>

    </div>



    <!-- 주요 통계 -->

    <div class="stats">


        <div class="stat-card">

            <div class="stat-title">
                📊 현재 평균 점수
            </div>

            <div class="stat-value">

                {{ "%.1f"|format(average) }}점

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                📚 관리 중인 과목
            </div>

            <div class="stat-value">

                {{ scores|length }}개

            </div>

        </div>


    </div>



    <!-- 메뉴 -->

    <div class="menu">


        <div
            class="menu-card"
            onclick="location.href='/grades'"
        >

            <div class="menu-icon">
                📊
            </div>

            <h2>성적 관리</h2>

            <p>
                과목별 성적을 추가하고 관리하세요.
            </p>

        </div>



        <div
            class="menu-card"
            onclick="location.href='/study'"
        >

            <div class="menu-icon">
                📚
            </div>

            <h2>공부 기록</h2>

            <p>
                오늘 공부한 내용을 기록하세요.
            </p>

        </div>



        <div
            class="menu-card"
            onclick="location.href='/statistics'"
        >

            <div class="menu-icon">
                📈
            </div>

            <h2>공부 통계</h2>

            <p>
                공부량을 한눈에 확인하세요.
            </p>

        </div>


    </div>


</div>


</body>

</html>
