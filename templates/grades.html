<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>성적 관리</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        header {
            background-color: #4f46e5;
            color: white;
            padding: 25px 40px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        input {
            padding: 10px;
            margin: 3px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background-color: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #3730a3;
        }

        .delete {
            background-color: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .average {
            font-size: 32px;
            font-weight: bold;
            color: #4f46e5;
        }

        a {
            color: #4f46e5;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1> 성적 관리</h1>
    <p>나의 과목별 성적을 관리하세요.</p>
</header>

<div class="container">

    <!-- 평균 -->
    <div class="card">
        <h2>현재 평균</h2>

        <div class="average">
            {{ "%.2f"|format(average) }}점
        </div>
    </div>


    <!-- 성적 추가 -->
    <div class="card">
        <h2> 성적 추가</h2>

        <form action="/add_score" method="POST">

            <input
                type="text"
                name="subject"
                placeholder="과목"
                required
            >

            <input
                type="number"
                name="score"
                placeholder="점수"
                min="0"
                max="100"
                required
            >

            <button type="submit">저장</button>

        </form>
    </div>


    <!-- 성적 목록 -->
    <div class="card">

        <h2> 과목별 성적</h2>

        <table>

            <tr>
                <th>과목</th>
                <th>점수</th>
                <th>관리</th>
            </tr>

            {% for item in scores %}

            <tr>

                <td>{{ item["subject"] }}</td>

                <td>{{ item["score"] }}점</td>

                <td>

                    <!-- 수정 -->
                    <form
                        action="/edit_score/{{ item['id'] }}"
                        method="POST"
                        style="display:inline;"
                    >

                        <input
                            type="text"
                            name="subject"
                            value="{{ item['subject'] }}"
                            required
                        >

                        <input
                            type="number"
                            name="score"
                            value="{{ item['score'] }}"
                            min="0"
                            max="100"
                            required
                        >

                        <button type="submit">
                            수정
                        </button>

                    </form>


                    <!-- 삭제 -->
                    <form
                        action="/delete_score/{{ item['id'] }}"
                        method="POST"
                        style="display:inline;"
                        onsubmit="return confirm('정말 삭제할까요?');"
                    >

                        <button
                            type="submit"
                            class="delete"
                        >
                            삭제
                        </button>

                    </form>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>


    <a href="/">← 메인 화면으로 돌아가기</a>

</div>

</body>
</html>
